<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>You're offline — JA Profile Studio</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens — mirrors globals.css dark theme ─────────────────── */
    :root {
      --bg:           #0f172a;
      --surface:      #1e293b;
      --surface-2:    #0f172a;
      --border:       #334155;
      --border-soft:  #1e293b;
      --text:         #f1f5f9;
      --text-muted:   #94a3b8;
      --text-subtle:  #475569;
      --primary:      #2563eb;
      --primary-hover:#1d4ed8;
      --red:          #ef4444;
      --red-bg:       rgba(239,68,68,0.10);
      --green:        #22c55e;
      --green-bg:     rgba(34,197,94,0.10);
      --amber:        #f59e0b;
      --amber-bg:     rgba(245,158,11,0.10);
      --radius:       1rem;
      --radius-sm:    0.625rem;
      --radius-pill:  9999px;
    }

    /* ── Base ────────────────────────────────────────────────────────────── */
    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      gap: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Card ────────────────────────────────────────────────────────────── */
    .card {
      max-width: 400px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.75rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    /* ── Icon ────────────────────────────────────────────────────────────── */
    .icon-wrap {
      width: 64px;
      height: 64px;
      background: var(--red-bg);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .icon-wrap svg {
      width: 32px; height: 32px;
      stroke: var(--red); fill: none;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── Status pill ─────────────────────────────────────────────────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-pill);
      margin-bottom: 1rem;
    }
    .pill.offline { background: var(--red-bg);   color: var(--red);   border: 1px solid rgba(239,68,68,0.2); }
    .pill.online  { background: var(--green-bg);  color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .dot.pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ── Typography ──────────────────────────────────────────────────────── */
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.4rem;
      text-align: center;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    /* ── Primary button ──────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.7rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover  { background: var(--primary-hover); }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Divider ─────────────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0 1rem;
      color: var(--text-subtle);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Brand footer ────────────────────────────────────────────────────── */
    .brand {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-subtle);
      letter-spacing: 0.02em;
    }

    /* ── Back-online toast ───────────────────────────────────────────────── */
    #toast {
      display: none;
      position: fixed;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background: #16a34a;
      color: #fff;
      padding: 0.55rem 1.25rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      z-index: 9999;
      white-space: nowrap;
      gap: 0.5rem;
      align-items: center;
    }
    #toast.show { display: inline-flex; }
  </style>
</head>
<body>

  <div id="toast">
    <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"/></svg>
    Back online — reloading…
  </div>

  <div class="card">

    <!-- Icon -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <!-- Status pill -->
    <div style="text-align:center">
      <span class="pill offline" id="pill">
        <span class="dot pulse"></span>
        <span id="pill-text">No internet connection</span>
      </span>
    </div>

    <h1>You're offline</h1>
    <p class="subtitle">
      Check your Wi-Fi or mobile data and try again.<br>
      Your data is safe — nothing has been lost.
    </p>

    <button class="btn" onclick="tryReload()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try again
    </button>

    <p class="brand">JA Profile Studio</p>
  </div>

  <script>
    function tryReload() { window.location.reload(); }

    // Auto-reload when connection is restored
    window.addEventListener('online', function () {
      var pill     = document.getElementById('pill');
      var pillText = document.getElementById('pill-text');
      var toast    = document.getElementById('toast');
      var dot      = pill.querySelector('.dot');

      pill.className     = 'pill online';
      dot.className      = 'dot';          // stop pulse
      pillText.textContent = 'Back online';
      toast.classList.add('show');

      setTimeout(function () { window.location.reload(); }, 1500);
    });

    // If already online when this page loads (SW served stale page)
    if (navigator.onLine) {
      var pill     = document.getElementById('pill');
      var pillText = document.getElementById('pill-text');
      var dot      = pill.querySelector('.dot');
      pill.className     = 'pill online';
      dot.className      = 'dot';
      pillText.textContent = 'Connection restored — reloading…';
      setTimeout(function () { window.location.reload(); }, 800);
    }
  </script>
</body>
</html>
