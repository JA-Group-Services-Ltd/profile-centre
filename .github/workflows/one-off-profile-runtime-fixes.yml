name: One-off profile runtime fixes

on:
  push:
    branches:
      - upgrade/full-site-qa-public-legal-sharing
    paths:
      - scripts/one-off-profile-runtime-fixes.mjs
      - .github/workflows/one-off-profile-runtime-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/full-site-qa-public-legal-sharing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted profile fixes
        run: node scripts/one-off-profile-runtime-fixes.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/profile.tsx src/pages/dashboard/profile.tsx src/pages/admin/profiles.tsx
          git commit -m "Fix profile runtime data and current production URLs"
          git push origin HEAD:upgrade/full-site-qa-public-legal-sharing
