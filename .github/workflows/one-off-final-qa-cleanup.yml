name: One-off final QA cleanup

on:
  push:
    branches:
      - upgrade/full-site-qa-public-legal-sharing
    paths:
      - .github/workflows/one-off-final-qa-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/full-site-qa-public-legal-sharing
          fetch-depth: 0

      - name: Remove temporary audit and repair tooling
        run: |
          rm -f \
            .github/workflows/one-off-final-qa-cleanup.yml \
            .github/workflows/one-off-api-inventory.yml \
            .github/workflows/one-off-api-inventory-report.yml \
            .github/workflows/one-off-profile-runtime-fixes.yml \
            .github/workflows/one-off-active-page-fixes.yml \
            .github/workflows/one-off-business-profile-type-fix.yml \
            scripts/one-off-api-inventory.mjs \
            scripts/one-off-api-inventory-report.mjs \
            scripts/one-off-profile-runtime-fixes.mjs \
            scripts/one-off-active-page-fixes.mjs \
            scripts/one-off-business-profile-type-fix.mjs \
            api-inventory-report.txt

      - name: Commit clean branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Branch already clean."
            exit 0
          fi
          git commit -m "Remove temporary QA audit tooling"
          git push origin HEAD:upgrade/full-site-qa-public-legal-sharing
