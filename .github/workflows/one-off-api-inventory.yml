name: One-off API wiring inventory

on:
  push:
    branches:
      - upgrade/full-site-qa-public-legal-sharing
    paths:
      - scripts/one-off-api-inventory.mjs
      - .github/workflows/one-off-api-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/full-site-qa-public-legal-sharing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inventory frontend API calls and Cloudflare Functions
        run: node scripts/one-off-api-inventory.mjs
