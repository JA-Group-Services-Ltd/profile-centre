name: Initialise Profile Centre D1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/initialise-profile-centre-d1.yml

permissions:
  contents: write

concurrency:
  group: initialise-profile-centre-d1
  cancel-in-progress: true

jobs:
  initialise:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialise D1 and record result
        shell: bash
        run: |
          set +e

          base_url="https://profilecentre.jagroupservices.co.uk"
          readiness_http="000"
          setup_http="not-run"
          health_http="not-run"
          result="failure"
          message="Cloudflare setup endpoint version 2 did not become ready."

          echo '{}' > /tmp/setup-readiness.json
          echo '{}' > /tmp/setup-result.json
          echo '{}' > /tmp/health.json

          for attempt in $(seq 1 45); do
            readiness_http=$(curl --silent --show-error --location \
              --output /tmp/setup-readiness.json \
              --write-out "%{http_code}" \
              "${base_url}/api/setup-database" 2>/tmp/curl-error.txt)
            curl_exit=$?

            echo "Readiness attempt ${attempt}: curl=${curl_exit}, HTTP ${readiness_http}"
            cat /tmp/setup-readiness.json 2>/dev/null
            echo

            if [[ "${readiness_http}" == "200" ]] && \
               grep -q '"installerVersion":"2"' /tmp/setup-readiness.json && \
               grep -Eq '"status":"(ready|already_configured)"' /tmp/setup-readiness.json; then
              message="Cloudflare setup endpoint version 2 is ready."
              break
            fi

            if [[ "${readiness_http}" == "409" ]] && grep -q '"installerVersion":"2"' /tmp/setup-readiness.json; then
              message="Database setup was blocked because unexpected tables already exist."
              break
            fi

            sleep 20
          done

          if [[ "${readiness_http}" == "200" ]] && \
             grep -q '"installerVersion":"2"' /tmp/setup-readiness.json && \
             grep -Eq '"status":"(ready|already_configured)"' /tmp/setup-readiness.json; then

            for post_attempt in $(seq 1 20); do
              setup_http=$(curl --silent --show-error --location \
                --request POST \
                --header "content-type: application/json" \
                --data '{}' \
                --output /tmp/setup-result.json \
                --write-out "%{http_code}" \
                "${base_url}/api/setup-database" 2>/tmp/setup-curl-error.txt)
              setup_exit=$?

              echo "Setup attempt ${post_attempt}: curl=${setup_exit}, HTTP ${setup_http}"
              cat /tmp/setup-result.json 2>/dev/null
              echo

              if [[ "${setup_exit}" == "0" ]] && \
                 [[ "${setup_http}" == "200" || "${setup_http}" == "201" ]] && \
                 grep -q '"installerVersion":"2"' /tmp/setup-result.json && \
                 grep -Eq '"status":"(created|already_configured)"' /tmp/setup-result.json && \
                 grep -q '"schemaVersion":"1"' /tmp/setup-result.json; then
                break
              fi

              sleep 15
            done

            if [[ "${setup_exit}" == "0" ]] && \
               [[ "${setup_http}" == "200" || "${setup_http}" == "201" ]] && \
               grep -q '"installerVersion":"2"' /tmp/setup-result.json && \
               grep -Eq '"status":"(created|already_configured)"' /tmp/setup-result.json && \
               grep -q '"schemaVersion":"1"' /tmp/setup-result.json; then

              for health_attempt in $(seq 1 12); do
                health_http=$(curl --silent --show-error --location \
                  --output /tmp/health.json \
                  --write-out "%{http_code}" \
                  "${base_url}/api/health" 2>/tmp/health-curl-error.txt)
                health_exit=$?

                echo "Health attempt ${health_attempt}: curl=${health_exit}, HTTP ${health_http}"
                cat /tmp/health.json 2>/dev/null
                echo

                if [[ "${health_exit}" == "0" ]] && \
                   [[ "${health_http}" == "200" ]] && \
                   grep -q '"status":"ok"' /tmp/health.json && \
                   grep -q '"schemaVersion":"1"' /tmp/health.json; then
                  result="success"
                  message="Profile Centre D1 schema version 1 was created and verified."
                  break
                fi

                sleep 10
              done

              if [[ "${result}" != "success" ]]; then
                message="The schema setup succeeded, but the health verification failed."
              fi
            else
              message="The D1 schema creation request did not reach installer version 2 successfully."
            fi
          fi

          mkdir -p docs
          {
            echo "result=${result}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "message=${message}"
            echo "readiness_http=${readiness_http}"
            echo "setup_http=${setup_http}"
            echo "health_http=${health_http}"
            echo
            echo "--- readiness response ---"
            cat /tmp/setup-readiness.json 2>/dev/null
            echo
            echo "--- setup response ---"
            cat /tmp/setup-result.json 2>/dev/null
            echo
            echo "--- health response ---"
            cat /tmp/health.json 2>/dev/null
            echo
            echo "--- curl errors ---"
            cat /tmp/curl-error.txt /tmp/setup-curl-error.txt /tmp/health-curl-error.txt 2>/dev/null
          } > docs/d1-initialisation-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/d1-initialisation-result.txt
          git commit -m "Record D1 initialisation result" || true
          git push

          if [[ "${result}" != "success" ]]; then
            exit 1
          fi
