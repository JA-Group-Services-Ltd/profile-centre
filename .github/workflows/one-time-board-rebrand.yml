name: Sousa Murray Profiles rebrand audit

# The Board-approved rebrand has been completed. This former one-time migration
# must not rewrite application code or push to a shared branch on every PR.
# It remains available as a manual, read-only audit when required.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify Board-approved public branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Audit customer-facing sources only. Do not mechanically rewrite
          # backend compatibility identifiers (for example legacy Stripe
          # metadata keys) or the public-brand scrubber's detection strings.
          roots = [Path('src/pages'), Path('src/components'), Path('src/lib/branding.ts')]
          retired = [
              'JA Profile Studio',
              'profilecentre.jagroupservices.co.uk',
              'profilecenter.jagroupservices.co.uk',
          ]
          allowed_marker_files = {
              Path('src/lib/public-brand-scrubber.ts'),
          }

          failures = []
          candidates = []
          for root in roots:
              if root.is_file():
                  candidates.append(root)
              elif root.exists():
                  candidates.extend(path for path in root.rglob('*') if path.is_file())

          for path in candidates:
              if path in allowed_marker_files:
                  continue
              if path.suffix.lower() not in {'.ts', '.tsx', '.js', '.jsx', '.html', '.css', '.md'}:
                  continue
              try:
                  content = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for marker in retired:
                  if marker in content:
                      failures.append(f'{path}: {marker}')

          branding = Path('src/lib/branding.ts').read_text(encoding='utf-8')
          required = [
              "platform_logo_url: ''",
              "master_brand_name: 'Sousa Murray'",
              "legal_company_name: 'JA Group Services Ltd'",
          ]
          for marker in required:
              if marker not in branding:
                  failures.append(f'src/lib/branding.ts missing required marker: {marker}')

          if failures:
              print('Sousa Murray Profiles branding audit failed:')
              for failure in failures:
                  print(f' - {failure}')
              raise SystemExit(1)

          print('Sousa Murray Profiles public branding audit passed.')
          print('Technical compatibility identifiers were intentionally left untouched.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build Cloudflare website
        run: npm run build:cloudflare
