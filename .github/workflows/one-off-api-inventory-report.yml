name: One-off API inventory report

on:
  push:
    branches:
      - upgrade/full-site-qa-public-legal-sharing
    paths:
      - scripts/one-off-api-inventory-report.mjs
      - .github/workflows/one-off-api-inventory-report.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/full-site-qa-public-legal-sharing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate API report
        run: node scripts/one-off-api-inventory-report.mjs
      - name: Commit API report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-inventory-report.txt
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "Generate temporary API wiring inventory"
          git push origin HEAD:upgrade/full-site-qa-public-legal-sharing
