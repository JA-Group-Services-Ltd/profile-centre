name: One-off active page repairs

on:
  push:
    branches:
      - upgrade/full-site-qa-public-legal-sharing
    paths:
      - scripts/one-off-active-page-fixes.mjs
      - .github/workflows/one-off-active-page-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/full-site-qa-public-legal-sharing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted repairs
        run: node scripts/one-off-active-page-fixes.mjs
      - name: Commit repaired active pages
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/settings.tsx src/pages/dashboard/business-cards.tsx src/pages/dashboard/overview.tsx
          git commit -m "Fix active admin and dashboard type faults"
          git push origin HEAD:upgrade/full-site-qa-public-legal-sharing
