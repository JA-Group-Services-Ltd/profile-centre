name: Validate Sousa Murray Profiles

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check React and TypeScript
        run: npm run type-check

      - name: Validate full public customer admin and integration contracts
        run: node tests/full-site-contracts.test.mjs

      - name: Validate customer service contract
        run: node tests/central-customer-service-bridge.test.mjs

      - name: Validate Admin CRM plan routes
        run: npx vitest run tests/admin-crm-plan-routes.test.mjs

      - name: Validate Custom Domains and dashboard entitlements
        run: npx vitest run tests/custom-domains.test.mjs

      - name: Validate Head Office event outbox
        run: npx vitest run tests/head-office-event-outbox.test.mjs

      - name: Run complete automated test suite
        run: npm test

      - name: Validate Cloudflare backend syntax
        run: |
          node --check functions/_shared/current-user-access.js
          node --check functions/_shared/current-user-route.js
          node --check functions/_shared/custom-domain-policy.js
          node --check functions/_shared/cloudflare-saas.js
          node --check functions/_shared/custom-domains.js
          node --check functions/_shared/custom-domain-routes.js
          node --check functions/_shared/head-office-schema.js
          node --check functions/_shared/head-office.js
          node --check functions/_shared/legal-policies.js
          node --check functions/_shared/stripe.js
          node --check 'functions/api/legal/[key].js'
          node --check functions/api/admin/legal.js
          node --check 'functions/api/admin/legal/[key].js'
          node --check 'functions/[[path]].js'
          node --check workers/custom-domain-router/index.js

      - name: Build Cloudflare production website
        run: npm run build:cloudflare
